[package]
name = "quty"
version = "0.1.0"
edition = "2021"

[lib]
name = "quty_lib"
crate-type = ["cdylib", "rlib"]

[dependencies]
eframe = "0.27"
num-complex = "0.4"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"


